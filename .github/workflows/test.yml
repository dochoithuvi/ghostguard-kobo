name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Shell and lifecycle tests
        run: |
          sh -n DCPRO_GhostGuard_Kobo_OneClick.sh
          make test
      - name: Go compile checks
        run: go test ./...
      - name: Cross-build Kobo license verifiers
        run: make license-verifiers
      - name: Package smoke build
        run: |
          make package koboroot
          test -s dist/GhostGuard-Kobo-v0.8.1-profile-v5.zip
          test -s dist/GhostGuard-Kobo-v0.8.1-profile-v5-KoboRoot.tgz
          unzip -t dist/GhostGuard-Kobo-v0.8.1-profile-v5.zip >/dev/null
          tar -tzf dist/GhostGuard-Kobo-v0.8.1-profile-v5-KoboRoot.tgz | grep -q '^mnt/onboard/.adds/ghostguard/ghostguard.sh$'
          tar -tzf dist/GhostGuard-Kobo-v0.8.1-profile-v5-KoboRoot.tgz | grep -q '^mnt/onboard/.adds/nm/ghostguard$'
          ! tar -tzf dist/GhostGuard-Kobo-v0.8.1-profile-v5-KoboRoot.tgz | grep -Eq 'profile_v5\.txt|online_licenses\.(json|sig)|online_license_sync_state'
