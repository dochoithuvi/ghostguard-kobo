name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Shell and lifecycle tests
        run: |
          sh -n DCPRO_GhostGuard_Kobo_OneClick.sh
          make test
      - name: Go compile checks
        run: go test ./...
      - name: Cross-build Kobo license verifiers
        run: make license-verifiers
      - name: Package smoke build
        run: |
          set -eux
          make package koboroot
          VERSION="$(awk '/^VERSION :=/{print $3; exit}' Makefile)"
          ZIP="dist/GhostGuard-Kobo-v${VERSION}.zip"
          TGZ="dist/GhostGuard-Kobo-v${VERSION}-KoboRoot.tgz"
          test -s "$ZIP"
          test -s "$TGZ"
          unzip -t "$ZIP" >/dev/null
          tar -tzf "$TGZ" | grep -q '^mnt/onboard/.adds/ghostguard/ghostguard.sh$'
          tar -tzf "$TGZ" | grep -q '^mnt/onboard/.adds/ghostguard/nm_quick.sh$'
          tar -tzf "$TGZ" | grep -q '^mnt/onboard/.adds/nm/ghostguard$'
          ! tar -tzf "$TGZ" | grep -Eq 'profile_v5\.txt|online_licenses\.(json|sig)|online_license_sync_state'
