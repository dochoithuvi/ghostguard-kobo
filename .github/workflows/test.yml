name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Shell and lifecycle tests
        run: make test
      - name: Go compile checks
        run: go test ./...
      - name: Cross-build Kobo license verifiers
        run: make license-verifiers
