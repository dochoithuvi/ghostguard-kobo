name: publish-online

on:
  push:
    branches: [main]
    paths:
      - 'Makefile'
      - 'cmd/**'
      - 'config/**'
      - 'include/**'
      - 'nickelmenu/**'
      - 'package/**'
      - 'scripts/**'
      - 'src/**'
      - 'tools/**'
      - 'tests/**'
      - 'DCPRO_GhostGuard_Kobo_OneClick.sh'
      - '.github/workflows/publish-online.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Native cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld
      - name: Build and test distribution
        run: |
          set -eux
          make test
          make package koboroot
          tar -tzf dist/*-KoboRoot.tgz | grep -q '^mnt/onboard/.adds/ghostguard/ghostguard.sh$'
          tar -tzf dist/*-KoboRoot.tgz | grep -q '^mnt/onboard/.adds/ghostguard/bin/ghostguardd-armv7$'
          tar -tzf dist/*-KoboRoot.tgz | grep -q '^mnt/onboard/.adds/ghostguard/bin/ghostguardd-aarch64$'
          tar -tzf dist/*-KoboRoot.tgz | grep -q '^mnt/onboard/.adds/nm/ghostguard$'
          ! tar -tzf dist/*-KoboRoot.tgz | grep -Eq '\.txt$|profile_v5\.txt|online_licenses\.(json|sig)|online_license_sync_state'
          ! grep -q '\.txt' package/.adds/ghostguard/ghostguard.sh
          ! grep -q '\.txt' package/.adds/ghostguard/profile_manager.sh
          grep -q 'sync >/dev/null 2>&1 &' package/.adds/ghostguard/nm_quick.sh
      - name: Publish stable online artifacts and manifest
        run: |
          set -eux
          VERSION="$(awk '/^VERSION :=/{print $3; exit}' Makefile)"
          ZIP_SRC="dist/GhostGuard-Kobo-v${VERSION}.zip"
          TGZ_SRC="dist/GhostGuard-Kobo-v${VERSION}-KoboRoot.tgz"
          DEST_DIR="packages/ghostguard-kobo/artifacts"
          ZIP_DEST="$DEST_DIR/GhostGuard-Kobo-v${VERSION}.zip"
          TGZ_DEST="$DEST_DIR/GhostGuard-Kobo-v${VERSION}-KoboRoot.tgz"
          mkdir -p "$DEST_DIR"
          cp "$ZIP_SRC" "$ZIP_DEST"
          cp "$TGZ_SRC" "$TGZ_DEST"
          cp "$TGZ_SRC" KoboRoot.tgz
          ZIP_SHA="$(sha256sum "$ZIP_DEST" | awk '{print $1}')"
          TGZ_SHA="$(sha256sum "$TGZ_DEST" | awk '{print $1}')"
          cat > manifest.online.json <<JSON
          {
            "manifest_version": 2,
            "id": "ghostguard-kobo",
            "name": "DCPRO GhostGuard Kobo",
            "version": "$VERSION",
            "artifact": "$ZIP_DEST",
            "sha256": "$ZIP_SHA",
            "koboroot_artifact": "$TGZ_DEST",
            "koboroot_sha256": "$TGZ_SHA",
            "koboroot_stable": "KoboRoot.tgz",
            "install_root": "/mnt/onboard/.adds/ghostguard",
            "license_registry": "https://raw.githubusercontent.com/dochoithuvi/ghostguard-kindle/main/licenses/licenses.json",
            "license_signature": "https://raw.githubusercontent.com/dochoithuvi/ghostguard-kindle/main/licenses/licenses.sig"
          }
          JSON
          {
            printf '%s  %s\n' "$ZIP_SHA" "$ZIP_DEST"
            printf '%s  %s\n' "$TGZ_SHA" "$TGZ_DEST"
            printf '%s  %s\n' "$TGZ_SHA" "KoboRoot.tgz"
          } > packages/ghostguard-kobo/SHA256SUMS
      - name: Commit distribution files
        run: |
          set -eux
          git config user.name "DCPRO Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- KoboRoot.tgz manifest.online.json packages/ghostguard-kobo/artifacts packages/ghostguard-kobo/SHA256SUMS
          if git diff --cached --quiet; then
            echo "Distribution already current."
          else
            VERSION="$(awk '/^VERSION :=/{print $3; exit}' Makefile)"
            git commit -m "Publish GhostGuard Kobo ${VERSION} online artifacts"
            git push origin HEAD:main
          fi
